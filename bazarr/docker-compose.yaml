x-traefik-labels: &traefik-template
  traefik.enable: true
  traefik.http.routers.bazarr-https.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.bazarr-https.entrypoints: websecure
  traefik.http.routers.bazarr-https.tls: true
  traefik.http.routers.bazarr-https.tls.certresolver: cloudflare
  traefik.http.routers.bazarr-https.service: ${APP_NAME}
  traefik.http.services.bazarr.loadbalancer.server.port: ${APP_PORT}

x-homepage-labels: &homepage-template
  homepage.group: ${HOMEPAGE_GROUP}
  homepage.name: ${HOMEPAGE_NAME}
  homepage.icon: ${HOMEPAGE_ICON}
  homepage.href: https://${APP_NAME}.${BASE_DOMAIN}
  homepage.description: ${HOMEPAGE_DESCRIPTION}
  homepage.widget.type: bazarr
  homepage.widget.url: http://${APP_NAME}:${APP_PORT}
  homepage.widget.key: ${HOMEPAGE_WIDGET_KEY}

x-kuma-labels: &kuma-template
  kuma.bazarr.http.name: ${HOMEPAGE_NAME}
  kuma.bazarr.http.url: https://${APP_NAME}.${BASE_DOMAIN}
  kuma.bazarr.http.max_retries: 3
  kuma.bazarr.http.interval: 60

services:
  bazarr:
    container_name: ${APP_NAME}
    image: lscr.io/linuxserver/bazarr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PUID: "0"
      PGID: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:${APP_PORT}/ || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    volumes:
      - ./config:/config
      - /18tb/media:/data
    networks:
      - frontend
    labels:
      <<: [*traefik-template, *homepage-template, *kuma-template]

networks:
  frontend:
    external: true