x-traefik-labels: &traefik-template
  traefik.enable: true
  traefik.http.routers.autobrr-https.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.autobrr-https.entrypoints: websecure
  traefik.http.routers.autobrr-https.tls: true
  traefik.http.routers.autobrr-https.tls.certresolver: cloudflare
  traefik.http.routers.autobrr-https.service: ${APP_NAME}
  traefik.http.services.autobrr.loadbalancer.server.port: ${APP_PORT}

x-homepage-labels: &homepage-template
  homepage.group: ${HOMEPAGE_GROUP}
  homepage.name: ${HOMEPAGE_NAME}
  homepage.icon: ${HOMEPAGE_ICON}
  homepage.href: https://${APP_NAME}.${BASE_DOMAIN}
  homepage.description: ${HOMEPAGE_DESCRIPTION}

x-kuma-labels: &kuma-template
  kuma.autobrr.http.name: ${HOMEPAGE_NAME}
  kuma.autobrr.http.url: https://${APP_NAME}.${BASE_DOMAIN}
  kuma.autobrr.http.max_retries: 3
  kuma.autobrr.http.interval: 60

services:
  autobrr:
    container_name: ${APP_NAME}
    image: ghcr.io/autobrr/autobrr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      AUTOBRR__HOST: 0.0.0.0
      AUTOBRR__PORT: ${APP_PORT}
      AUTOBRR__SESSION_SECRET: ${SESSION_SECRET}
      AUTOBRR__LOG_LEVEL: INFO
      AUTOBRR__CHECK_FOR_UPDATES: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:${APP_PORT}/api/healthz/liveness || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    volumes:
      - ./config:/config
    networks:
      - frontend
    labels:
      <<: [*traefik-template, *homepage-template, *kuma-template]

networks:
  frontend:
    external: true
