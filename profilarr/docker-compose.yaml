x-traefik-labels: &traefik-template
  traefik.enable: true
  traefik.http.routers.profilarr-https.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.profilarr-https.entrypoints: websecure
  traefik.http.routers.profilarr-https.tls: true
  traefik.http.routers.profilarr-https.tls.certresolver: cloudflare
  traefik.http.routers.profilarr-https.service: ${APP_NAME}
  traefik.http.services.profilarr.loadbalancer.server.port: ${APP_PORT}

x-homepage-labels: &homepage-template
  homepage.group: ${HOMEPAGE_GROUP}
  homepage.name: ${HOMEPAGE_NAME}
  homepage.icon: ${HOMEPAGE_ICON}
  homepage.href: https://${APP_NAME}.${BASE_DOMAIN}
  homepage.description: ${HOMEPAGE_DESCRIPTION}

x-kuma-labels: &kuma-template
  kuma.profilarr.http.name: ${HOMEPAGE_NAME}
  kuma.profilarr.http.url: https://${APP_NAME}.${BASE_DOMAIN}
  kuma.profilarr.http.max_retries: 3
  kuma.profilarr.http.interval: 60

services:
  profilarr:
    container_name: ${APP_NAME}
    image: santiagosayshey/profilarr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      PUID: "1000"
      PGID: "1000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request as u; u.urlopen('http://localhost:${APP_PORT}/', context=ssl._create_unverified_context(), timeout=5)"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    volumes:
      - ./config:/config
    networks:
      - frontend
    labels:
      <<: [*traefik-template, *homepage-template, *kuma-template]

networks:
  frontend:
    external: true