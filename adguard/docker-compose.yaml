x-traefik-labels: &traefik-template
  traefik.enable: true
  traefik.http.routers.adguard-https.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.adguard-https.entrypoints: websecure
  traefik.http.routers.adguard-https.tls: true
  traefik.http.routers.adguard-https.tls.certresolver: cloudflare
  traefik.http.routers.adguard-https.service: ${APP_NAME}
  traefik.http.services.adguard.loadbalancer.server.port: ${APP_PORT}

x-homepage-labels: &homepage-template
  homepage.group: ${HOMEPAGE_GROUP}
  homepage.name: ${HOMEPAGE_NAME}
  homepage.icon: ${HOMEPAGE_ICON}
  homepage.href: https://${APP_NAME}.${BASE_DOMAIN}
  homepage.description: ${HOMEPAGE_DESCRIPTION}

x-kuma-labels: &kuma-template
  kuma.adguard.http.name: ${HOMEPAGE_NAME}
  kuma.adguard.http.url: https://${APP_NAME}.${BASE_DOMAIN}
  kuma.adguard.http.max_retries: 3
  kuma.adguard.http.interval: 60

services:
  adguard:
    container_name: ${APP_NAME}
    image: adguard/adguardhome:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${APP_PORT}/login.html || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    volumes:
      - ./config:/opt/adguardhome/conf
      - ./workdir:/opt/adguardhome/work
    ports:
      - ${LAN_IP:?set LAN_IP in .env}:53:53/tcp
      - 53:53/udp
      - 853:853/tcp
      - 853:853/udp
    networks:
      - frontend
      - backend
    labels:
      <<: [*traefik-template, *homepage-template, *kuma-template]

networks:
  frontend:
    external: true
  backend:
    external: true