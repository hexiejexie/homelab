x-traefik-labels: &traefik-template
  traefik.enable: true
  traefik.http.routers.n8n-http.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.n8n-http.entrypoints: web
  traefik.http.routers.n8n-http.middlewares: redirect-to-https
  traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: https
  traefik.http.routers.n8n-https.rule: Host(`${APP_NAME}.${BASE_DOMAIN}`)
  traefik.http.routers.n8n-https.entrypoints: websecure
  traefik.http.routers.n8n-https.tls: true
  traefik.http.routers.n8n-https.tls.certresolver: cloudflare
  traefik.http.routers.n8n-https.service: ${APP_NAME}
  traefik.http.services.n8n.loadbalancer.server.port: ${APP_PORT}

x-homepage-labels: &homepage-template
  homepage.group: ${HOMEPAGE_GROUP}
  homepage.name: ${HOMEPAGE_NAME}
  homepage.icon: ${HOMEPAGE_ICON}
  homepage.href: https://${APP_NAME}.${BASE_DOMAIN}
  homepage.description: ${HOMEPAGE_DESCRIPTION}

x-kuma-labels: &kuma-template
  kuma.n8n.http.name: ${HOMEPAGE_NAME}
  kuma.n8n.http.url: https://${APP_NAME}.${BASE_DOMAIN}
  kuma.n8n.http.max_retries: 3
  kuma.n8n.http.interval: 60

services:
  n8n:
    container_name: ${APP_NAME}
    image: n8nio/n8n:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_HOST=${APP_NAME}.${BASE_DOMAIN}
      - N8N_EDITOR_BASE_URL=https://${APP_NAME}.${BASE_DOMAIN}
      - N8N_PROTOCOL=https 
      - NODE_ENV=production
      - WEBHOOK_URL=https://${APP_NAME}.${BASE_DOMAIN}/
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./n8n-data:/home/node/.n8n
      - ./files:/files
    networks:
      - frontend
    labels:
      <<: [*traefik-template, *homepage-template, *kuma-template]

networks:
  frontend:
    external: true